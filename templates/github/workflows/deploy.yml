name: Deploy Vercel
on:
  push:
    branches: [main, develop, preview]
permissions:
  contents: read
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 65.11.0
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:ci
      - name: Check target settings
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull, build, and deploy verified commit
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            vercel pull --yes --environment=production
            vercel build --prod
            vercel deploy --prebuilt --prod > deployment-url.txt
          else
            vercel pull --yes --environment=preview --git-branch="$GITHUB_REF_NAME"
            vercel build
            vercel deploy --prebuilt > deployment-url.txt
          fi
          printf 'Commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat deployment-url.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Update develop preview address
        if: github.ref == 'refs/heads/develop'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(cat deployment-url.txt)"
          vercel alias set "$deployment_url" \
            github-vercel-okki-develop-tech-for-impact.vercel.app \
            --scope tech-for-impact
          printf 'Develop preview: https://github-vercel-okki-develop-tech-for-impact.vercel.app\n' >> "$GITHUB_STEP_SUMMARY"
